apiVersion: apps/v1
kind: Deployment
metadata: { name: hr-platform-api, labels: { app: hr-platform-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: hr-platform-api } }
  template:
    metadata: { labels: { app: hr-platform-api } }
    spec:
      containers:
        - name: api
          image: ${ECR_REGISTRY}/hr-platform-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: hr-platform-secrets } }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: hr-platform-api }
spec:
  selector: { app: hr-platform-api }
  ports: [{ port: 80, targetPort: 8080 }]
