apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: hr-platform-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: hr-platform-api }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: hr-platform-api }
spec: { minAvailable: 2, selector: { matchLabels: { app: hr-platform-api } } }
