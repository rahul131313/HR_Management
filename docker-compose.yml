services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hr_master
      MYSQL_USER: hr_app
      MYSQL_PASSWORD: hr_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql-data:
